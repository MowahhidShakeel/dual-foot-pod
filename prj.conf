# Bluetooth stack
CONFIG_BT=y
CONFIG_BT_CENTRAL=n
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="nRF5340-IMU"
CONFIG_BT_DEVICE_APPEARANCE=0
CONFIG_BT_MAX_CONN=1
CONFIG_BT_SMP=y

# Random / entropy (needed if you call sys_rand* APIs)
CONFIG_ENTROPY_GENERATOR=y

# Logging (optional, helpful)
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
